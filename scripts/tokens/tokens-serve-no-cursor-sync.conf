# Drop-in for tokens-serve.service on the one machine that reports Cursor:
# install as ~/.config/systemd/user/tokens-serve.service.d/no-cursor-sync.conf.
# serve syncs Cursor whenever it finds cursor-credentials.json in its config
# dir, so it runs from a sibling dir that links everything else back.
# See docs/tokens-reporters.md.
[Service]
Environment=TOKENS_CONFIG_DIR=%h/.config/tokens-serve
