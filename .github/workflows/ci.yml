name: CI

# Pushing to main deploys (Cloudflare Workers Builds), so this runs the
# same gate as the Workers Builds build command, `npm run check`: type
# generation, Biome format check, typecheck (src and tests) and the vitest
# suite. A red run on main means the deploy Workers Builds ran in parallel
# was a regression; pull requests get the verdict before merging.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs; mutable tags
      # could be repointed at malicious code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
