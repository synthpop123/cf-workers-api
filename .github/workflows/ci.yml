name: CI

# Pushing to main deploys (Cloudflare Workers Builds), so this runs the
# same gate as the Workers Builds build command, `npm run check`: type
# generation, Biome format + lint, typecheck (src and tests) and the vitest
# suite. A red run on main means the deploy Workers Builds ran in parallel
# was a regression; pull requests get the verdict before merging.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs; mutable tags
      # could be repointed at malicious code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
