version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev:
        patterns: ["*"]
        exclude-patterns: ["wrangler", "@cloudflare/*"]
    ignore:
      # A Vitest major must fit @cloudflare/vitest-plugin's peer range, and
      # a new TypeScript major can outrun what wrangler/workers-types
      # support; both move when the Cloudflare packages do, by hand.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
